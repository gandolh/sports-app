<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the player screen can reach into the safe areas;
         maximum-scale is deliberately omitted (pinch-zoom must stay available). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      One theme-color, set to the resolved theme. The manifest carries the light
      value, because a manifest has exactly one; this overrides it in the browser,
      where the app is actually looked at. The blocking script below sets the dark
      value before the first paint, and `setTheme` in `theme.ts` re-sets it from
      `--bg` when the choice changes.

      The two values are `--bg` from `ui/tokens.css`, light here and dark in the
      script. They are the only hex literals outside that file, because `<meta>` cannot read a
      custom property — there is no `var()` in an attribute. `noHexColors` globs
      `client/src/**`, so this file is outside it by construction rather than by
      exemption.
    -->
    <meta name="theme-color" content="#e9edf1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default`, not `black-translucent`: translucent draws the status bar's
         own text in white over the page, which on the light theme is invisible.
         iOS has no media-query form of this, so the value that stays legible in
         both themes is the one that ships. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The one font, self-hosted and preloaded. Inter since the direction round
         — `archivo-latin-var.woff2` is still on disk but nothing references it.
         Offline-first means no font CDN, and preloading stops the first paint of
         a 132px numeral happening in the system stack and then reflowing. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Theme and accent, stamped before the first paint.

      A blocking inline script rather than an effect, because React's first paint
      happens only after the bundle parses: stamping from a component means one
      frame of the wrong theme on every cold load, which is the flash the
      `theme-color` pair above exists to prevent.

      Both stamps are ATTRIBUTES on the root element and never inline styles. An
      inline `--accent` on `documentElement` overrides both `:root[data-theme]`
      blocks at once, which is the one known bug in the reference build: its
      light mode paints the dark-mode mint on white at 1.8:1.
      `ui/components/theme.ts` owns the same two keys and re-stamps live when
      the Appearance controls on /account are used; this is only the cold start,
      and the two must keep agreeing about the key names and the accent pattern
      below.

      Absent `data-theme` means "follow the OS" and absent `data-accent` means
      mint, so an unwritten key is a real state rather than a missing one and
      nothing is stamped for it. Wrapped in try/catch because `localStorage`
      throws outright in some privacy modes, and a theme preference is not worth
      a blank page.
    -->
    <script>
      try {
        var t = localStorage.getItem("sports-app.theme");
        if (t !== "dark" && t !== "system") t = "light";
        document.documentElement.setAttribute("data-theme", t);
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#080b0e");
        var a = localStorage.getItem("sports-app.accent");
        if (a && /^[a-z]{4,8}$/.test(a)) document.documentElement.setAttribute("data-accent", a);
      } catch (_) {
        /* No stored preference is readable. Light, the first-visit default, is correct. */
        document.documentElement.setAttribute("data-theme", "light");
      }
    </script>
    <title>Calisthenics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
