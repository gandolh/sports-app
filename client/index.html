<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the player screen can reach into the safe areas;
         maximum-scale is deliberately omitted (pinch-zoom must stay available). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The one font, self-hosted and preloaded. Offline-first means no font CDN,
         and preloading it stops the first paint of a 132px numeral happening in
         the system font and then reflowing. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Calisthenics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
